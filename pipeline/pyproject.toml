[project]
name = "pic-pipeline"
version = "1.0.0"
description = "Pure Insights Command Center — CSV → PostgreSQL data pipeline, Snowflake ACCOUNT_USAGE simulator and SQL-suite verifier"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Markdown report templates and embedded SQL read better unwrapped
"pic_pipeline/dq_report.py" = ["E501"]
"pic_pipeline/findings.py" = ["E501"]
"pic_pipeline/export_snowflake_csv.py" = ["E501"]
"pic_pipeline/forensics.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
