name: pure-insights-command-center

services:
  postgres:
    image: postgres:16-alpine
    container_name: pic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-pic}
      POSTGRES_PASSWORD: ${PGPASSWORD:-pic_dev_password}
      POSTGRES_DB: ${PGDATABASE:-pure_insights}
    ports:
      - "${PGPORT:-5433}:5432"
    volumes:
      - pic_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pic_pgdata:
